<div class="gauge" [ngClass]="'level-' + level">
  <svg viewBox="0 0 200 112" role="img" [attr.aria-label]="'Risk gauge showing ' + percent + ' percent'">
    <path class="track" d="M 14 100 A 86 86 0 0 1 186 100" pathLength="100" />
    <path class="value" d="M 14 100 A 86 86 0 0 1 186 100" pathLength="100" [attr.stroke-dasharray]="percent + ' 100'" />
  </svg>
  <div class="read">
    <span class="pct">{{ percent }}<small>%</small></span>
    <span class="lvl">{{ label }}</span>
  </div>
</div>
