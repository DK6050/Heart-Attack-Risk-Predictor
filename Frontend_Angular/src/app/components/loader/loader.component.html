<ng-container *ngIf="loader.state$ | async as s">
  <div class="overlay" *ngIf="s.visible" role="status" aria-live="polite" aria-busy="true">
    <div class="box">
      <div class="pulse" aria-hidden="true">
        <span class="wave"></span><span class="wave w2"></span>
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <p>{{ s.text }}</p>
    </div>
  </div>
</ng-container>
