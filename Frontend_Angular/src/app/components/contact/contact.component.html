<app-site-header variant="public"></app-site-header>

<main class="auth">
    <aside class="auth-aside">
        <div class="auth-aside-inner">
            <img src="assets/art/contact-art.svg" alt="" />
            <h2>We'd love to hear from you</h2>
            <p>Questions, feedback or ideas? Send us a message and we will get back to you.</p>
        </div>
    </aside>

    <section class="auth-main">
        <div class="auth-card auth-card-wide">
            <h1>Contact us</h1>
            <p class="sub">Tell us how we can help.</p>

            <div class="form-grid">
                <div class="field">
                    <label for="nm">Name</label>
                    <div class="input-icon">
                        <i class="bi bi-person"></i>
                        <input type="text" class="input" id="nm" name="nm" placeholder="Your name" autocomplete="name">
                    </div>
                </div>
                <div class="field">
                    <label for="ph">Phone number</label>
                    <div class="input-icon">
                        <i class="bi bi-telephone"></i>
                        <input type="tel" inputmode="numeric" class="input" id="ph" name="ph" maxlength="10" placeholder="10-digit mobile" autocomplete="tel">
                    </div>
                </div>
            </div>

            <div class="field">
                <label for="em">Email</label>
                <div class="input-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="email" class="input" id="em" name="em" placeholder="you@example.com" autocomplete="email">
                </div>
            </div>

            <div class="field">
                <label for="msg">Message</label>
                <textarea class="input" rows="6" id="msg" name="msg" placeholder="Write your message here"></textarea>
            </div>

            <button type="button" class="btn btn-primary btn-lg btn-block" id="btn_senddata" name="btn_senddata" (click)="validateContact()" [disabled]="sending">
                <i class="bi bi-send"></i> Send message
            </button>
        </div>
    </section>
</main>

<app-site-footer></app-site-footer>
