<app-site-header variant="public"></app-site-header>

<main class="auth">
    <aside class="auth-aside">
        <div class="auth-aside-inner">
            <img src="assets/art/hero-heart.svg" alt="" />
            <h2>Welcome back</h2>
            <p>Sign in to run predictions, explore your data and manage patient records.</p>
            <ul class="auth-points">
                <li><i class="bi bi-heart-pulse"></i> Instant risk estimates</li>
                <li><i class="bi bi-bar-chart-line"></i> Live dashboards</li>
                <li><i class="bi bi-shield-lock"></i> Secure, token-based sign-in</li>
            </ul>
        </div>
    </aside>

    <section class="auth-main">
        <div class="auth-card">
            <h1>Sign in</h1>
            <p class="sub">Enter your credentials to continue.</p>

            <div class="field">
                <label for="em">Email</label>
                <div class="input-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="text" class="input" id="em" name="em" placeholder="you@example.com" autocomplete="username" (keydown.enter)="validateLogin()"/>
                </div>
            </div>

            <div class="field">
                <label for="pswd">Password</label>
                <div class="input-icon">
                    <i class="bi bi-lock"></i>
                    <div class="pw-wrap">
                        <input #pw type="password" class="input" id="pswd" name="pswd" placeholder="Your password" autocomplete="current-password" (keydown.enter)="validateLogin()"/>
                        <button type="button" class="pw-toggle" (click)="pw.type = pw.type === 'password' ? 'text' : 'password'"
                                [attr.aria-label]="pw.type === 'password' ? 'Show password' : 'Hide password'"
                                [attr.aria-pressed]="pw.type !== 'password'" tabindex="-1">
                            <i class="bi" [class.bi-eye]="pw.type === 'password'" [class.bi-eye-slash]="pw.type !== 'password'"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-primary btn-lg btn-block" id="btn_logindata" name="btn_logindata" (click)="validateLogin()" [disabled]="busy">
                Sign in <i class="bi bi-arrow-right"></i>
            </button>

            <p class="auth-alt">New here? <a routerLink="/register">Create an account</a></p>
        </div>
    </section>
</main>

<app-site-footer></app-site-footer>
