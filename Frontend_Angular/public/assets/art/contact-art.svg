<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Messages illustration">
  <defs>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#06142b" flood-opacity="0.4"/>
    </filter>
    <style>
      .bob { animation: bob 4.5s ease-in-out infinite; }
      .bob2 { animation: bob 5.5s ease-in-out infinite reverse; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      .typing circle { animation: typing 1.2s ease-in-out infinite; }
      .typing circle:nth-child(2) { animation-delay: 0.2s; }
      .typing circle:nth-child(3) { animation-delay: 0.4s; }
      @keyframes typing { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .bob, .bob2, .typing circle { animation: none; } }
    </style>
  </defs>
  <circle cx="240" cy="205" r="190" fill="url(#g)"/>

  <g class="bob" filter="url(#sh)">
    <rect x="110" y="140" width="260" height="170" rx="22" fill="url(#env)"/>
    <path d="M118 152 L240 245 L362 152" fill="none" stroke="url(#flap)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 298 L206 218 M362 298 L274 218" fill="none" stroke="#1e40af" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g class="bob2" filter="url(#sh)">
    <rect x="300" y="64" width="130" height="62" rx="18" fill="#fff"/>
    <path d="M326 126 L318 148 L346 126 Z" fill="#fff"/>
    <g class="typing" fill="#2563eb">
      <circle cx="338" cy="95" r="7"/>
      <circle cx="365" cy="95" r="7"/>
      <circle cx="392" cy="95" r="7"/>
    </g>
  </g>

  <g class="bob" filter="url(#sh)">
    <rect x="52" y="86" width="116" height="54" rx="16" fill="#fff"/>
    <path d="M142 140 L152 158 L124 140 Z" fill="#fff"/>
    <rect x="70" y="104" width="68" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="70" y="119" width="44" height="8" rx="4" fill="#e2e8f0"/>
  </g>
</svg>
