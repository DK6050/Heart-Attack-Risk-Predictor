<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="Animated heart with a heartbeat line">
  <defs>
    <linearGradient id="heartFill" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff8fa0"/>
      <stop offset="0.55" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06142b" flood-opacity="0.45"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#06142b" flood-opacity="0.28"/>
    </filter>
    <style>
      .ring { fill: none; stroke: #60a5fa; stroke-width: 2; transform-origin: 280px 235px; animation: ring 3.2s ease-out infinite; opacity: 0; }
      .ring.r2 { animation-delay: 1.06s; }
      .ring.r3 { animation-delay: 2.12s; }
      @keyframes ring { 0% { transform: scale(0.55); opacity: 0.7; } 100% { transform: scale(1.35); opacity: 0; } }

      .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
      @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.06); } 24% { transform: scale(1); } 36% { transform: scale(1.04); } 48% { transform: scale(1); } }

      .ecg { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 700; stroke-dashoffset: 700; animation: ecg 3.2s linear infinite; filter: drop-shadow(0 0 6px rgba(255,255,255,0.85)); }
      @keyframes ecg { 0% { stroke-dashoffset: 700; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -700; } }

      .float1 { animation: float 5s ease-in-out infinite; }
      .float2 { animation: float 6s ease-in-out infinite reverse; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .dot { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .ring, .beat, .ecg, .float1, .float2, .dot { animation: none; opacity: 1; stroke-dashoffset: 0; } .ring { opacity: 0.25; } }
    </style>
  </defs>

  <!-- soft glow and pulse rings -->
  <circle cx="280" cy="235" r="215" fill="url(#glow)"/>
  <circle class="ring" cx="280" cy="235" r="150"/>
  <circle class="ring r2" cx="280" cy="235" r="150"/>
  <circle class="ring r3" cx="280" cy="235" r="150"/>

  <!-- heart -->
  <g class="beat" filter="url(#soft)">
    <path d="M280 420 C130 310 70 235 70 160 C70 98 118 58 172 58 C218 58 258 84 280 128 C302 84 342 58 388 58 C442 58 490 98 490 160 C490 235 430 310 280 420 Z" fill="url(#heartFill)"/>
    <path d="M280 420 C130 310 70 235 70 160 C70 98 118 58 172 58 C218 58 258 84 280 128 C302 84 342 58 388 58 C442 58 490 98 490 160 C490 235 430 310 280 420 Z" fill="url(#shine)" opacity="0.5"/>
  </g>

  <!-- heartbeat line across the heart -->
  <path class="ecg" d="M24 250 H170 L200 250 L225 188 L262 322 L300 148 L335 292 L358 250 H536"/>

  <!-- floating info cards -->
  <g class="float1" filter="url(#card)">
    <rect x="22" y="70" width="170" height="64" rx="16" fill="#fff"/>
    <circle cx="52" cy="102" r="17" fill="#fee2e2"/>
    <path d="M52 112 C43 105 42 100 42 97.5 C42 94.5 44.4 92.5 47 92.5 C49.3 92.5 51 93.9 52 96 C53 93.9 54.7 92.5 57 92.5 C59.6 92.5 62 94.5 62 97.5 C62 100 61 105 52 112 Z" fill="#e11d48"/>
    <text x="80" y="97" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="500">Heart rate</text>
    <text x="80" y="119" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#0f172a" font-weight="800">72 bpm</text>
  </g>
  <g class="float2" filter="url(#card)">
    <rect x="352" y="318" width="186" height="64" rx="16" fill="#fff"/>
    <circle cx="382" cy="350" r="17" fill="#dcfce7"/>
    <path d="M374 351 L380 357 L391 344" fill="none" stroke="#16a34a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="410" y="345" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="500">Risk level</text>
    <text x="410" y="367" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#0f172a" font-weight="800">Low</text>
    <circle class="dot" cx="516" cy="350" r="5" fill="#22c55e"/>
  </g>
</svg>
